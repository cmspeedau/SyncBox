[package]
name = "syncbox-mount"
description = "Vault-as-filesystem model: namespace, metadata, and content reads for the FUSE mount (kernel-free, testable)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The filesystem *model* lives here with no `fuser`/libfuse dependency, so the
# namespace, metadata, and read logic are unit-tested without a FUSE driver and
# `cargo test --workspace` still passes on a machine with no libfuse. The `fuser`
# adapter that turns these operations into FUSE callbacks is a thin layer kept out
# of this crate.

[dependencies]
syncbox-crypto.workspace = true
syncbox-index.workspace = true
syncbox-sync.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
