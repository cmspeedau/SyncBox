[package]
name = "syncbox-desktop"
version = "0.1.0"
description = "Syncbox desktop app (Tauri v2 shell over the sync agent)"
edition = "2021"
rust-version = "1.85"

# This crate is a STANDALONE workspace and is excluded from the client workspace
# (see client/Cargo.toml). That is the whole point: `cargo test --workspace` never
# needs the Tauri system libraries, which are only required to build this app.
#
# The Linux build needs webkit2gtk-4.1, gtk-3, libsoup-3.0, javascriptcoregtk-4.1
# (present on a desktop). The tray icon additionally needs libappindicator, so the
# tray is left behind a feature for now (see README); M6 packaging installs it.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features = false drops `tray-icon` (needs libappindicator) and the
# image decoders; `wry` is the real runtime and must be enabled back explicitly.
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Tauri-free crates the whole client is built on, pulled by path from the
# (excluded) client workspace. The agent crate carries all the behaviour and its
# tests; this shell only maps it across the IPC boundary. `ureq` on transport gives
# the app the same real HTTPS client the CLI uses.
syncbox-agent = { path = "../../../crates/agent" }
syncbox-crypto = { path = "../../../crates/crypto" }
syncbox-sync = { path = "../../../crates/sync" }
syncbox-transport = { path = "../../../crates/transport", features = ["ureq"] }
syncbox-vault = { path = "../../../crates/vault" }
