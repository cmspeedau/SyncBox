[package]
name = "syncbox-desktop"
version = "0.1.1"
description = "Syncbox desktop app (Tauri v2 shell over the sync agent)"
edition = "2021"
# Tauri 2.12 and tauri-plugin-updater 2.14 both declare 1.90. The Tauri-free
# crates keep the workspace's 1.85; only this shell needs the newer compiler.
rust-version = "1.90"
license = "MIT"

# This crate is a MEMBER of the client workspace (see client/Cargo.toml): a plain
# package, not a workspace of its own. So `cargo check`/`clippy`/`test --workspace`
# compile it and its tests, and `cargo tauri build` bundles it from the workspace.
# Its build needs the Tauri system libraries: webkit2gtk-4.1, gtk-3, libsoup-3.0,
# javascriptcoregtk-4.1 (present on a desktop; CI's `Client (Rust)` job is pinned to
# the runner that has them). The tray backend opens libayatana-appindicator with
# `dlopen` at *runtime*, not at link time, so the tray compiles everywhere and the
# package manager only matters where the app runs — see src/tray.rs.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features = false keeps the dependency set small; what the app does use
# is named: `wry` is the real runtime, `tray-icon` is the tray (its Linux backend
# dlopens libayatana-appindicator at runtime, costing the build nothing), and
# `image-png` lets `include_image!` read the tray glyph.
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png"] }
# The tray probes for the same library the tray backend opens, the same way
# (`dlopen` by soname), so a machine without it degrades to windows-only
# instead of taking the panics that are `libappindicator-sys`'s failure mode.
libloading = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# 2.14 is the first line with `requireSignedVersion`, which pins the artifact to
# the version the update manifest announces. The release workflow signs the
# bundle with that version in the trusted comment.
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Tauri-free crates the whole client is built on, pulled by path from the
# (excluded) client workspace. The agent crate carries all the behaviour and its
# tests; this shell only maps it across the IPC boundary. `ureq` on transport gives
# the app the same real HTTPS client the CLI uses.
syncbox-agent = { path = "../../../crates/agent" }
syncbox-crypto = { path = "../../../crates/crypto" }
syncbox-index = { path = "../../../crates/index" }
syncbox-sync = { path = "../../../crates/sync" }
syncbox-transport = { path = "../../../crates/transport", features = ["ureq"] }
syncbox-vault = { path = "../../../crates/vault" }

[dev-dependencies]
# `tauri::test` (MockRuntime): lets the autostart plugin be exercised headlessly
# in a unit test. Feature-unified into test builds only — the release binary
# keeps exactly the dependencies above.
tauri = { version = "2", default-features = false, features = ["test"] }
