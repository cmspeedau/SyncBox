[workspace]
resolver = "2"
members = [
  "crates/crypto",
  "crates/vault",
  "crates/index",
  "crates/sync",
  "crates/transport",
  "crates/agent",
  "crates/mount",
  "apps/cli",
  "apps/desktop/src-tauri",
]

# The desktop app is a member, so `cargo check`/`clippy`/`test --workspace` also
# compile the Tauri shell. That means building the whole workspace now needs the
# Tauri system libraries — webkit2gtk-4.1, gtk-3, libsoup-3.0, javascriptcoregtk-4.1
# on Linux (the SDKs elsewhere). CI's `Client (Rust)` job is pinned to the one
# runner that has them (see .github/workflows/ci.yml), and `cargo tauri build`
# bundles from here rather than from the crate's old standalone workspace.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
syncbox-crypto = { path = "crates/crypto" }
syncbox-index = { path = "crates/index" }
syncbox-sync = { path = "crates/sync" }
syncbox-transport = { path = "crates/transport" }
syncbox-vault = { path = "crates/vault" }
syncbox-agent = { path = "crates/agent" }
syncbox-mount = { path = "crates/mount" }

# External
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
aes-siv = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ureq = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
