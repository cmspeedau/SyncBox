[workspace]
resolver = "2"
members = [
  "crates/crypto",
  "crates/vault",
  "crates/index",
  "crates/sync",
  "crates/transport",
  "apps/cli",
]

# The desktop app joins the workspace in M4, once the Tauri system dependencies
# (webkit2gtk on Linux, the Windows and macOS SDKs) are wired into CI. Keeping it
# excluded now means `cargo check` still works on a machine without them.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
syncbox-crypto = { path = "crates/crypto" }
syncbox-index = { path = "crates/index" }
syncbox-sync = { path = "crates/sync" }
syncbox-transport = { path = "crates/transport" }
syncbox-vault = { path = "crates/vault" }

# External
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
aes-siv = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
