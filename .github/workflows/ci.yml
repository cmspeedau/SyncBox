name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Client (Rust)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Format
        run: cargo fmt --all -- --check

      # Warnings are errors here so a lint does not ride along until someone
      # eventually silences it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  go:
    name: Server (Go)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Tests
        run: go test -race ./...

  image:
    name: Server image builds
    # Self-hosted with Docker: the NUC host runner (label `docker`) builds the
    # image without pushing it. The Incus CI container deliberately stays out —
    # it is unprivileged, so container-in-container would be sandpaper. Building
    # here also keeps the laptop runner free; publishing stays a deliberate act.
    runs-on: [self-hosted, docker]
    needs: go
    steps:
      - uses: actions/checkout@v4

      # Built but not published: an untagged push would be someone else's decision
      # to make.
      - name: Build
        run: docker build -f deploy/Dockerfile -t syncbox/server:ci .

  package:
    name: Package (Linux desktop)
    # Self-hosted: both Linux runners carry the webkit2gtk/gtk development
    # libraries and the bundler needs no Debian packaging tools for its .deb —
    # it emits one through ar/tar, and linuxdeploy bootstraps its own patchelf.
    # The first run on a fresh runner installs cargo-tauri into ~/.cargo/bin and
    # every later one reuses it. Bundles are uploaded as build artifacts only —
    # signing and publishing stay deliberate (and macOS/Windows packaging needs
    # their own runners and identities, deferred).
    runs-on: self-hosted
    needs: rust
    defaults:
      run:
        working-directory: client/apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/apps/desktop/src-tauri

      - name: Install system libraries (hosted runners only)
        run: |
          # Both self-hosted runners carry the webkit dev stack permanently, so
          # the apt dance is a hosted-runner fallback — and checking for the
          # library itself (not for apt) means a warm runner never re-installs
          # 200 MB of already-present packages.
          if command -v apt-get >/dev/null 2>&1 && ! pkg-config --exists webkit2gtk-4.1; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev patchelf
          else
            echo "webkit2gtk-4.1 already present (or no apt): nothing to install"
          fi

      - name: Install tauri CLI
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            mkdir -p "$HOME/.cargo/bin"
            curl -sSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.3/cargo-tauri-x86_64-unknown-linux-gnu.tgz" \
              | tar -xz -C "$HOME/.cargo/bin"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo-tauri --version

      - name: Build bundles
        run: cargo-tauri build --bundles deb appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncbox-desktop-linux
          path: |
            client/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            client/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
