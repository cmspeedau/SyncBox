name: CI

# ---- the fleet this runs on (rebuilt 18 Oct 2026, each name checked against
# ---- that runner's own log rather than remembered) -------------------------
#
#   linux-docker-desktop   agentId 28, on the CachyOS desktop (8 cores/14 GB).
#       labels: self-hosted, Linux, docker, desktop
#       The general-purpose builder: it runs `Client (Rust)` (pinned), the
#       `.deb`/AppImage bundling, and any image build the NUC does not take. It is
#       the only runner with the native webkit2gtk-4.1/gtk/libsoup development
#       libraries and real FUSE, which is what makes AppImage bundling possible —
#       which is also why `desktop` is the one label held by exactly one box, and
#       therefore the only thing that can pin a Linux job anywhere.
#   intel nuc runner       agentId 29, container `github-runner`
#       (myoung34/github-runner:2.338.0-debian-bookworm) on the Alpine NUC.
#       configured labels: self-hosted, docker
#       Has the docker CLI and a mounted daemon. Its toolchains arrive fresh for
#       every job, so it is a poor host for a cargo build and a tolerable one for
#       `docker build`.
#
# What that means for the jobs below:
#   - `Linux` and `X64` are NOT choices: GitHub adds those two automatically from
#     the runner's reported OS and architecture, so a job asking for
#     [self-hosted, Linux] can be taken by the NUC container as easily as by the
#     desktop. Labels you actually control are the extras (`docker`, `desktop`),
#     and the only way to keep a Linux job on one box is to ask for a second label
#     that only that box has. `Client (Rust)` is pinned that way, with `desktop`;
#     `Server (Go)` is deliberately left shareable because the NUC handles it in
#     seconds. Anything new that compiles Rust belongs on the desktop too.
#   - A label with no runner behind it does not fail. The job sits in the queue for
#     24 hours — GitHub's limit for self-hosted queue time — and is only cancelled
#     then, which is why every job below carries an explicit `timeout-minutes` and
#     why the manual dispatch can fire the `canary` probe below.
#   - Two runners answer `docker`, so the image job may land on either box.
#
# Adding a job? Read the note at the top of the project build plan first; the
# short version is that an unserved label does not fail, it just queues, and that
# these boxes are not the ubuntu-latest sandbox your habits expect.

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs exist so runner routing can be checked without inventing a commit:
  # Actions -> CI -> Run workflow, then read "Runner name" in each job's log.
  # Worth doing after any change to the self-hosted fleet, because a job whose label
  # has no runner left does not fail: it queues for 24 hours and is cancelled then,
  # which leaves no failed conclusion anywhere. `canary_label` is how to test that
  # path on purpose — name a label no runner has and watch whether the canary fails
  # at its own timeout (visible, dated) or simply sits there.
  workflow_dispatch:
    inputs:
      canary_label:
        description: >-
          Label for the canary job. A label no runner has (e.g. `ghost`) exercises
          the waiting-for-a-runner path; `desktop`, `docker` or `macOS` probe a real
          box. Leave empty to skip the canary entirely.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  rust:
    name: Client (Rust)
    # Pinned to the desktop box by asking for `desktop` next to `Linux`. That label
    # is the only one a single runner has, and `Linux` alone is not a pin: GitHub
    # adds `Linux`/`X64` itself from each runner's OS and architecture, so on run
    # 39104747110 this job was taken by the 2-core NUC container and built the whole
    # workspace there in 4m32s. It passed — and it was competing with nine other
    # containers for 8 GB while doing it. Ask for a label only one box has and you
    # get that box, which is also the box with warm caches and 14 GB.
    # `Server (Go)` below stays unpinned on purpose: the NUC does it in ~25s, and
    # leaving one Linux job shareable keeps the two heavy jobs starting at once.
    runs-on: [self-hosted, Linux, desktop]
    # Sized from real runs, with room for a cold cache: this job took 4m32s on a
    # warm cache (run 39104747110). It is also the job most likely to wedge the only
    # desktop runner, so the rope is short on purpose.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Format
        run: cargo fmt --all -- --check

      # Warnings are errors here so a lint does not ride along until someone
      # eventually silences it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  go:
    name: Server (Go)
    runs-on: [self-hosted, Linux]
    # 25s on the NUC with a warm `_work/_tool` (run 39104747110); 10 minutes covers a
    # cold toolchain download plus `go test -race` on two cores.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Tests
        run: go test -race ./...

  image:
    name: Server image builds
    # `docker` is a label we control, and two runners carry it: the desktop box
    # (native docker) and the NUC's container runner, which reaches the Alpine
    # host's daemon through a mounted /var/run/docker.sock — so the image is built
    # by the host either way, not inside the job container. The Incus CI container
    # deliberately stays out: it is unprivileged, so container-in-container would
    # be sandpaper. Built, never pushed — publishing stays a deliberate act.
    runs-on: [self-hosted, docker]
    needs: go
    # 10s warm on the desktop runner. 15 minutes covers a cold layer cache plus the
    # runtime check's own 30s+30s curl loops, which would otherwise be the only
    # thing bounding this job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Built but not published: an untagged push would be someone else's decision
      # to make.
      - name: Build
        run: docker build -f deploy/Dockerfile -t syncbox/server:ci .

      # `docker build` proves the compiler is happy; a scratch image can still
      # die on boot (wrong user, unwritable volume, broken ENTRYPOINT) and show
      # none of it in the build output. This step runs the very tag built above,
      # probes it over loopback, and asserts the essentials: it answers /healthz,
      # boots uninitialized and takes its password through first run, refuses
      # strangers, and keeps a space registered as `sync` in the clear —
      # a cleartext name and body in, the same out (S2's server-side contract,
      # which the Rust engine's fake server can only approximate). A throwaway
      # container ships no SYNCBOX_PASSWORD, so it boots uninitialized; the probe
      # gives it a password over the one-shot setup route rather than reading a
      # secret out of a log. The assertions on the auth paths are the point of
      # the exercise: a regression that ships an open server fails HERE, not in
      # someone's deployment.
      - name: Runtime check
        run: |
          set -euo pipefail
          # One rule for everything below: never pipe into `head` or `grep -q`.
          # Both quit as soon as they have what they came for, the writer then
          # takes a SIGPIPE, and under pipefail *that* is the step's exit code —
          # 141, with every assertion above it already green. Test substrings
          # (`[[ $x == *needle* ]]`) and read from a file instead; a `sed -n` or
          # `tail` that consumes all its input is fine.
          name="syncbox-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker stop "$name" >/dev/null 2>&1 || true' EXIT
          # --rm plus the trap means no corpse survives this step, failed or
          # cancelled, and the run-id name keeps two builds on this runner
          # from stepping on each other.
          docker run -d --rm --name "$name" -p 127.0.0.1::8080 syncbox/server:ci >/dev/null

          # Random loopback host port (the `::8080` syntax): collision-free on
          # a shared runner, and bound to loopback so the probe never goes out
          # over a real interface. The mapping exists once the container runs.
          port=""
          for _ in $(seq 1 10); do
            # No `| head -1`: this format prints one line for one container, and
            # a reader that quits early is exactly how a pipe starts failing here
            # — see the closing evidence step below.
            port=$(docker inspect \
              --format '{{(index .NetworkSettings.Ports "8080/tcp" 0).HostPort}}' \
              "$name" 2>/dev/null) || port=""
            [ -n "$port" ] && break
            sleep 1
          done
          if [ -z "$port" ]; then
            echo "::error::container never published its port"
            docker logs "$name" 2>&1 | tail -40 || true
            exit 1
          fi

          body=""
          for _ in $(seq 1 30); do
            body=$(curl -fsS --max-time 3 "http://127.0.0.1:${port}/healthz" 2>/dev/null) && break
            body=""
            sleep 1
          done
          if [ -z "$body" ]; then
            echo "::error::/healthz never answered 200 within 30s"
            docker logs "$name" 2>&1 | tail -40
            exit 1
          fi
          echo "healthz answered: $body"
          if [[ $body != *'"status":"ok"'* ]]; then
            echo "::error::/healthz answered but not status ok"
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            "http://127.0.0.1:${port}/api/v1/vaults/probe/chunks/deadbeef")
          if [ "$code" != 401 ]; then
            echo "::error::unauthenticated chunk read got $code, expected 401"
            docker logs "$name" 2>&1 | tail -40
            exit 1
          fi
          # Before first run the server has no password, so it says so and lets
          # nobody in. Both answers are the assertion that a fresh image cannot
          # be signed into and cannot be scraped for a credential.
          status=$(curl -fsS --max-time 3 "http://127.0.0.1:${port}/api/v1/auth/status")
          if [[ $status != *'"initialized":false'* ]]; then
            echo "::error::a fresh image reported itself initialized: $status"
            docker logs "$name" 2>&1 | tail -40
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            -X POST -d '{"password":"wrong"}' "http://127.0.0.1:${port}/api/v1/auth/token")
          if [ "$code" != 401 ]; then
            echo "::error::token before first run got $code, expected 401"
            docker logs "$name" 2>&1 | tail -40
            exit 1
          fi

          # ---- first run: give this throwaway server its password ----
          # The image ships uninitialized (no SYNCBOX_PASSWORD), exactly what a
          # throwaway container wants: the probe sets a password over the
          # one-shot setup route, so no credential ever appears in the workflow.
          # The boot log is kept for the closing-evidence step at the end.
          boot_log="${RUNNER_TEMP:-.}/syncbox-boot.log"
          password="syncbox-ci-first-run-9f3a"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
            -d "$(printf '{"password":"%s"}' "$password")" \
            "http://127.0.0.1:${port}/api/v1/auth/setup")
          if [ "$code" != 201 ]; then
            echo "::error::first-run setup got $code, expected 201"
            docker logs "$name" 2>&1 | tail -40
            exit 1
          fi
          # The setup door is one-shot: a second attempt must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 -X POST \
            -d '{"password":"another-password-here"}' \
            "http://127.0.0.1:${port}/api/v1/auth/setup")
          if [ "$code" != 409 ]; then
            echo "::error::a second setup got $code, expected 409 already_initialized"
            exit 1
          fi
          # Now a wrong password is refused on its merits, not for lack of one.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            -X POST -d '{"password":"wrong"}' "http://127.0.0.1:${port}/api/v1/auth/token")
          if [ "$code" != 401 ]; then
            echo "::error::wrong password after setup got $code, expected 401"
            exit 1
          fi
          token=$(curl -fsS --max-time 5 -X POST \
            -d "$(printf '{"password":"%s"}' "$password")" \
            "http://127.0.0.1:${port}/api/v1/auth/token" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$token" ]; then
            echo "::error::the token exchange returned no token"
            docker logs "$name" 2>&1 | tail -40
            exit 1
          fi
          auth="Authorization: Bearer ${token}"

          # ---- a sync space, end to end --------------------------------
          # S2's server-side contract. The Rust engine suite proves the client
          # codec against a fake; this proves the *deployed* server stores and
          # serves a space the operator registered as `sync` in the clear,
          # without ever trying to decrypt a name or a byte.

          created=$(curl -fsS --max-time 3 -X POST -H "$auth" \
            -d '{"name":"Probe","mode":"sync"}' \
            "http://127.0.0.1:${port}/admin/vaults")
          if [[ $created != *'"mode":"sync"'* ]]; then
            echo "::error::a space created with mode=sync did not come back as sync: $created"
            exit 1
          fi
          space=$(echo "$created" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          if [ -z "$space" ]; then
            echo "::error::space creation returned no id: $created"
            exit 1
          fi

          # A cleartext body goes in and comes back byte for byte.
          chunk="PROBECHUNK0000001"
          printf 'hello in the clear' | curl -fsS --max-time 3 -X PUT -H "$auth" \
            --data-binary @- \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/chunks/${chunk}" >/dev/null
          got=$(curl -fsS --max-time 3 -H "$auth" \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/chunks/${chunk}")
          if [ "$got" != "hello in the clear" ]; then
            echo "::error::the server did not hand back the cleartext chunk as stored: $got"
            exit 1
          fi

          # A cleartext name is committed and read back through the log. The
          # manifest is the real sync-space record rather than a placeholder,
          # because the share download below has to read it to find the chunks:
          # SBXSYNC1 || size:u64 || count:u32 || (stored_len:u32 || id_len:u16 || id).
          manifest=$(printf 'SBXSYNC1\x12\x00\x00\x00\x00\x00\x00\x00\x01\x00\x00\x00\x12\x00\x00\x00\x11\x00%s' "$chunk" \
            | base64 | tr -d '\n')
          curl -fsS --max-time 3 -X POST -H "$auth" \
            -d "{\"parent\":0,\"revision\":{\"revision\":0,\"parent\":0,\"dir_id\":\"00\",\"cipher_name\":\"hello.txt\",\"manifest\":\"${manifest}\",\"size\":18,\"modified_unix\":0,\"deleted\":false}}" \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/revisions" >/dev/null
          revisions=$(curl -fsS --max-time 3 -H "$auth" \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/revisions?since=0")
          if [[ $revisions != *'"cipher_name":"hello.txt"'* ]]; then
            echo "::error::the server did not keep the cleartext name: $revisions"
            exit 1
          fi

          # And the registry the client reads agrees that it is a sync space.
          listed=$(curl -fsS --max-time 3 -H "$auth" "http://127.0.0.1:${port}/vaults")
          if [[ $listed != *'"mode":"sync"'* ]]; then
            echo "::error::the client registry did not list the space as sync: $listed"
            exit 1
          fi

          # ---- what a space the server can read is now good for -------------
          # S3's three surfaces, against the deployed image. Browse decodes the
          # cleartext path, a signed link hands ONE file to a caller holding no
          # credential, the recycle bin sees a deletion and a restore takes it
          # back — and a space registered as `vault` refuses all of it by code.
          # These are the routes where the "we never read a vault" promise is
          # easiest to break, so they are asserted here and not only in Go.
          files=$(curl -fsS --max-time 3 -H "$auth" \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/files")
          if [[ $files != *'"path":"hello.txt"'* ]]; then
            echo "::error::browse did not decode the cleartext path: $files"
            exit 1
          fi

          shared=$(curl -fsS --max-time 3 -X POST -H "$auth" \
            -d '{"dir_id":"00","cipher_name":"hello.txt"}' \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/shares")
          share=$(echo "$shared" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$share" ]; then
            echo "::error::minting a share returned no token: $shared"
            exit 1
          fi
          # No "$auth" header on purpose: the link is the credential. A share that
          # needed the operator's token would not be a link anyone could open.
          got=$(curl -fsS --max-time 3 "http://127.0.0.1:${port}/api/v1/shares/${share}")
          if [ "$got" != "hello in the clear" ]; then
            echo "::error::the share link served '$got' instead of the file's own bytes"
            exit 1
          fi
          # The server hands out content it did not author from the origin the
          # console lives on, so it must arrive as a download, never as a page.
          disposition=$(curl -fsS --max-time 3 -D - -o /dev/null \
            "http://127.0.0.1:${port}/api/v1/shares/${share}" \
            | tr -d '\r' | sed -n 's/^[Cc]ontent-[Dd]isposition: attachment.*/attachment/p')
          if [ "$disposition" != "attachment" ]; then
            echo "::error::a shared file was not served as an attachment"
            exit 1
          fi
          # A link edited by anyone is refused rather than half-honoured.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            "http://127.0.0.1:${port}/api/v1/shares/${share}x")
          if [ "$code" != 401 ]; then
            echo "::error::a forged share link got $code, expected 401"
            exit 1
          fi

          # The bin sees the deletion, and a restore is a commit that brings it back.
          curl -fsS --max-time 3 -X POST -H "$auth" \
            -d '{"parent":1,"revision":{"revision":0,"parent":1,"dir_id":"00","cipher_name":"hello.txt","manifest":"","size":0,"modified_unix":0,"deleted":true}}' \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/revisions" >/dev/null
          recycled=$(curl -fsS --max-time 3 -H "$auth" \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/recycle")
          if [[ $recycled != *'"path":"hello.txt"'* ]]; then
            echo "::error::the recycle bin lost the deletion: $recycled"
            exit 1
          fi
          curl -fsS --max-time 3 -X POST -H "$auth" \
            -d '{"dir_id":"00","cipher_name":"hello.txt"}' \
            "http://127.0.0.1:${port}/api/v1/vaults/${space}/recycle/restore" >/dev/null

          # And a vault is refused, with a code rather than prose.
          vaulty=$(curl -fsS --max-time 3 -X POST -H "$auth" \
            -d '{"name":"Vaulty","mode":"vault"}' "http://127.0.0.1:${port}/admin/vaults" \
            | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 -H "$auth" \
            "http://127.0.0.1:${port}/api/v1/vaults/${vaulty}/files")
          if [ "$code" != 403 ]; then
            echo "::error::browsing a vault got $code, expected 403"
            exit 1
          fi
          body=$(curl -s --max-time 3 -X POST -H "$auth" \
            -d '{"dir_id":"00","cipher_name":"hello.txt"}' \
            "http://127.0.0.1:${port}/api/v1/vaults/${vaulty}/shares")
          if [[ $body != *'"code":"not_shareable"'* ]]; then
            echo "::error::sharing a vault did not answer not_shareable: $body"
            exit 1
          fi

          # The boot log is the closing evidence: the first-run and
          # listen-everywhere warnings should be visible — proof the config layer
          # spoke, and that the scratch image ran long enough to speak. Reading it
          # from a file rather than piping `docker logs` into `head` is not
          # tidiness: the probe logs a line per request now, so the log outgrew
          # the truncation, `head` began quitting early, and the writer's SIGPIPE
          # failed this step with 141 *after* every assertion above had passed.
          # 40 lines is boot chatter plus one line per probe request.
          docker logs "$name" >"$boot_log" 2>&1
          head -40 "$boot_log"
          echo "runtime check passed: booted uninitialized, completed first run, refused"
          echo "strangers, kept a sync space in the clear, browsed it, shared one file to"
          echo "a stranger, emptied and refilled its recycle bin, and refused a vault thrice"

  package:
    name: Package (Linux desktop)
    # The `desktop` label, which exactly one runner has: `linux-docker-desktop`,
    # the CachyOS desktop box. It carries the webkit2gtk/gtk/libsoup development
    # libraries natively and, unlike the containerised NUC runner, has real FUSE —
    # which linuxdeploy (itself an AppImage) needs to bundle the AppImage. The
    # bundler needs no packaging tools for its .deb either: it emits one
    # through ar/tar, and linuxdeploy bootstraps its own patchelf.
    # Ask for `desktop` and you get that one machine: it is the only way to pin a
    # Linux job to a box, since `Linux` itself is automatic on both.
    # The first run on a fresh runner installs cargo-tauri into ~/.cargo/bin and
    # every later one reuses it. Bundles are uploaded as build artifacts only —
    # signing and publishing stay deliberate (Windows packaging still needs a
    # runner of its own; macOS's lives in package-macos below).
    # Linux only — see the note on `rust` about the Mac mini.
    runs-on: [self-hosted, desktop]
    needs: rust
    # 4m18s warm (run 39104747110). 45 minutes: a cold linuxdeploy run plus two
    # bundles on one box that is also building Rust.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/apps/desktop/src-tauri

      - name: Install system libraries (hosted runners only)
        run: |
          # The self-hosted runners carry the webkit dev stack permanently, so
          # the apt dance is a hosted-runner fallback — and checking for the
          # library itself (not for apt) means a warm runner never re-installs
          # 200 MB of already-present packages.
          if command -v apt-get >/dev/null 2>&1 && ! pkg-config --exists webkit2gtk-4.1; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev patchelf
          else
            echo "webkit2gtk-4.1 already present (or no apt): nothing to install"
          fi

      - name: Install tauri CLI
        run: |
          # Look for the binary both in PATH and where this step installs it:
          # a runner whose PATH lacks ~/.cargo/bin still has last run's copy.
          # Either way, if PATH cannot see it, fix PATH for later steps too.
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            if [ ! -x "$HOME/.cargo/bin/cargo-tauri" ]; then
              mkdir -p "$HOME/.cargo/bin"
              curl -sSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.3/cargo-tauri-x86_64-unknown-linux-gnu.tgz" \
                | tar -xz -C "$HOME/.cargo/bin"
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          # GITHUB_PATH additions only take effect from the NEXT step, so a
          # first-ever run on a runner cannot see what it just installed.
          # Exporting here closes that boundary for this step (later steps
          # get it through GITHUB_PATH anyway).
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo-tauri --version

      - name: Build bundles
        run: cargo-tauri build --bundles deb appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncbox-desktop-linux
          path: |
            client/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            client/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  package-macos:
    name: Package (macOS x86_64)
    # The Intel Mac mini, and only it: unsigned .app + .dmg for
    # x86_64-apple-darwin, built where the toolchain is native. macOS forbids
    # virtualising its OS on foreign hardware, so this box IS the macOS
    # runner. Signing and notarisation wait on an Apple Developer identity —
    # deliberate, like every other publish gate in this project. An Apple
    # Silicon runner would be a second, separate target (aarch64-apple-darwin),
    # not a replacement for this one.
    # If this box goes quiet, this job does not fail: it queues for 24 hours and is
    # cancelled then, leaving no failed conclusion behind (see the canary job). The
    # tell is a run that simply never finishes.
    runs-on: [self-hosted, macOS]
    needs: rust
    # 5m32s on a warm target dir (run 39104747110, first run on the re-registered
    # Mini). 45 minutes because this is the slowest bundle step on the slowest box.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/apps/desktop/src-tauri

      - name: Install tauri CLI
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            mkdir -p "$HOME/.cargo/bin"
            # Apple platforms ship the CLI as a zip; everyone else gets a tgz.
            case "$RUNNER_OS" in
              macOS) asset=cargo-tauri-x86_64-apple-darwin.zip ;;
              *)     asset=cargo-tauri-x86_64-unknown-linux-gnu.tgz ;;
            esac
            tmp="$(mktemp)"
            curl -sSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.3/$asset" -o "$tmp"
            case "$asset" in
              *.zip) unzip -o -q "$tmp" -d "$HOME/.cargo/bin" ;;
              *)     tar -xz -f "$tmp" -C "$HOME/.cargo/bin" ;;
            esac
            rm -f "$tmp"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo-tauri --version

      - name: Build bundles
        run: cargo-tauri build --bundles app dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncbox-desktop-macos
          path: |
            client/apps/desktop/src-tauri/target/release/bundle/osx/*.app
            client/apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  canary:
    # A deliberate probe of the one failure mode this workflow cannot otherwise see:
    # a job whose label has no runner behind it. Fire it from Actions -> Run workflow
    # with `canary_label` set to a label no runner has (`ghost`) and see which of
    # these two happens:
    #
    #   1. it fails at `timeout-minutes` — queue time counts against the timeout, so
    #      the `timeout-minutes` on every job above is also a hard bound on how long
    #      a missing runner stays invisible, and the failure is dated and greppable.
    #      That is the outcome to want.
    #   2. it sits until the 24-hour queue limit — queue time is excluded from the
    #      timeout, so a missing runner is only ever visible live, and the real fix
    #      is an availability check using a token that can read /actions/runners
    #      (this repo's fine-grained PAT gets 403 there), not a timeout.
    #
    # With the input left empty, the `if` skips this job, so pushes and PRs never
    # see it and nothing about ordinary CI changes.
    name: Runner canary (${{ inputs.canary_label }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_label != '' }}
    runs-on: [self-hosted, '${{ inputs.canary_label }}']
    timeout-minutes: 5
    steps:
      - name: Who caught me
        run: |
          echo "picked up by: ${RUNNER_NAME:-nobody} ($(uname -sr))"
          echo "at: $(date -u +%FT%TZ)"
          echo "reaching this line means a runner answers '${{ inputs.canary_label }}'."

      # Informational, and it never fails the job: whether the runner inventory is
      # readable at all, and with which credential. GITHUB_TOKEN cannot be granted
      # administration:read, so 403 here is the expected answer until a token that
      # can read it is stored as RUNNER_ADMIN_TOKEN.
      - name: Runner inventory
        env:
          ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tok="${ADMIN_TOKEN:-$DEFAULT_TOKEN}"
          src="GITHUB_TOKEN"
          [ -n "$ADMIN_TOKEN" ] && src="RUNNER_ADMIN_TOKEN"
          code=$(curl -sS -o runners.json -w '%{http_code}' \
            -H "Authorization: Bearer $tok" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners") \
            || code=000
          echo "  $src -> HTTP $code"
          if [ "$code" = 200 ]; then
            python3 -c 'import json; rows=[(r["name"], r["status"], ",".join(l["name"] for l in r["labels"])) for r in json.load(open("runners.json"))["runners"]]; [print("   %-22s %-8s %s" % t) for t in rows]'
          else
            echo "  inventory unreadable: runner visibility needs administration:read"
            echo "  which GITHUB_TOKEN cannot have; store such a token as RUNNER_ADMIN_TOKEN"
          fi
