name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Client (Rust)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Format
        run: cargo fmt --all -- --check

      # Warnings are errors here so a lint does not ride along until someone
      # eventually silences it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  go:
    name: Server (Go)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Tests
        run: go test -race ./...

  image:
    name: Server image builds
    # GitHub-hosted: it ships Docker. The self-hosted runner has no container
    # toolchain installed, so `docker build` there fails with exit 127. The image is
    # still only built, never pushed — publishing stays a deliberate act.
    runs-on: desktop
    needs: go
    steps:
      - uses: actions/checkout@v4

      # Built but not published: an untagged push would be someone else's decision
      # to make.
      - name: Build
        run: docker build -f deploy/Dockerfile -t syncbox/server:ci .

  package:
    name: Package (Linux desktop)
    # Self-hosted: this box already carries the webkit2gtk/gtk development
    # libraries (the desktop app builds here) and the tauri CLI in ~/.cargo/bin,
    # and the bundler needs no Debian packaging tools to do its job — it emits
    # the .deb through ar/tar and linuxdeploy bootstraps patchelf itself. The
    # apt step below stays for a hosted runner, should this ever move back.
    # Bundles are uploaded as build artifacts only — signing and publishing
    # stay deliberate (and macOS/Windows packaging needs their own runners and
    # identities, deferred).
    runs-on: self-hosted
    needs: rust
    defaults:
      run:
        working-directory: client/apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/apps/desktop/src-tauri

      - name: Install system libraries (hosted runners only)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev patchelf
          else
            echo "no apt (self-hosted): webkit dev libs are already installed and" \
                 "the bundler supplies ar/tar + its own patchelf — skipping"
          fi

      - name: Install tauri CLI
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            mkdir -p "$HOME/.cargo/bin"
            curl -sSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.3/cargo-tauri-x86_64-unknown-linux-gnu.tgz" \
              | tar -xz -C "$HOME/.cargo/bin"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo-tauri --version

      - name: Build bundles
        run: cargo-tauri build --bundles deb appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncbox-desktop-linux
          path: |
            client/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            client/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
